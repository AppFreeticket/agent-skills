name: validate

on:
  push:
  pull_request:

# The plugin manifests are hand-written and there is no build step, so nothing
# else would catch a stray field or a bad transport type until someone tries to
# install it. This is that check.
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-plugin.mjs
